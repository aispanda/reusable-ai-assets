name: Sync to GCS
on:
  workflow_call:
    inputs:
      gcs_bucket:
        description: Consumer-owned Cloud Storage bucket name
        required: true
        type: string
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v1
      - run: gsutil -m cp -r . "gs://${ARTIFACT_BUCKET}/${GITHUB_SHA}/"
        env:
          ARTIFACT_BUCKET: ${{ inputs.gcs_bucket }}
